<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розрахунок вартості</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #10b981;
        }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text-dark); 
            padding: 2rem 1rem; 
            margin: 0; 
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; margin-top: 0; margin-bottom: 2rem; color: var(--text-dark); font-size: 1.8rem; }
        
        .subject-grid {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .subject-row {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1.25rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s;
        }

        .subject-row.active {
            border-color: #d97706;
            box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.1);
            background: #fffdfa;
            border-width: 2px;
        }

        .row-top {
            display: grid;
            grid-template-columns: 2fr 1.5fr 2.5fr 1.5fr;
            align-items: center;
            gap: 1rem;
        }
        
        .col-name { display: flex; align-items: center; gap: 0.75rem; font-weight: 600; }
        .col-name input[type="checkbox"] { width: 1.25rem; height: 1.25rem; accent-color: #d97706; cursor: pointer; }
        .col-name select { font-weight: 500; font-size: 0.9rem; padding: 0.3rem; border-radius: 6px; border: 1px solid var(--border); }
        
        select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            font-family: inherit;
            color: var(--text-dark);
            font-size: 0.95rem;
            cursor: pointer;
        }
        select:disabled { background: #f1f5f9; cursor: not-allowed; opacity: 0.6; }

        .stream-badges {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            width: fit-content;
            font-weight: 500;
        }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-blue { background: #e0e7ff; color: #3730a3; }

        .total-display { font-weight: 700; color: var(--text-dark); text-align: right; font-size: 1.2rem; }
        .total-display small { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
        
        .summary-card {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            padding: 2.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            text-align: center;
            border: 1px solid #fde68a;
        }
        
        .summary-title { color: #b45309; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .grand-total { font-size: 3.5rem; font-weight: 800; color: #d97706; line-height: 1.2; }

        .installments-box {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #fcd34d;
            font-size: 1.15rem;
            color: #92400e;
        }

        @media (max-width: 768px) {
            .row-top { grid-template-columns: 1fr; gap: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="container" id="calculator-container">
    <h2>Розрахунок вартості</h2>

    <div class="subject-grid" id="subjectsContainer">
        
        <!-- Укр. мова -->
        <div class="subject-row active" id="row-ukr">
            <div class="row-top">
                <label class="col-name">
                    <input type="checkbox" id="check-ukr" onchange="toggleRow('ukr'); calculate();" checked>
                    <span>Українська мова</span>
                </label>
                <div>
                    <select id="tariff-ukr" onchange="calculate()">
                        <option value="standard">Стандарт</option>
                        <option value="premium">Преміум</option>
                    </select>
                </div>
                <div>
                    <select id="stream-ukr" onchange="calculate()"></select>
                </div>
                <div class="total-display">
                    <span id="total-ukr">0 ₴</span>
                    <small id="dur-ukr"></small>
                </div>
            </div>
            <div class="stream-badges" id="badges-ukr"></div>
        </div>

        <!-- Математика -->
        <div class="subject-row active" id="row-math">
            <div class="row-top">
                <label class="col-name">
                    <input type="checkbox" id="check-math" onchange="toggleRow('math'); calculate();" checked>
                    <span>Математика</span>
                </label>
                <div>
                    <select id="tariff-math" onchange="calculate()">
                        <option value="standard">Стандарт</option>
                        <option value="premium">Преміум</option>
                    </select>
                </div>
                <div>
                    <select id="stream-math" onchange="calculate()"></select>
                </div>
                <div class="total-display">
                    <span id="total-math">0 ₴</span>
                    <small id="dur-math"></small>
                </div>
            </div>
            <div class="stream-badges" id="badges-math"></div>
        </div>

        <!-- Історія -->
        <div class="subject-row active" id="row-hist">
            <div class="row-top">
                <label class="col-name">
                    <input type="checkbox" id="check-hist" onchange="toggleRow('hist'); calculate();" checked>
                    <span>Історія України</span>
                </label>
                <div>
                    <select id="tariff-hist" onchange="calculate()">
                        <option value="standard">Стандарт</option>
                        <option value="premium">Преміум</option>
                    </select>
                </div>
                <div>
                    <select id="stream-hist" onchange="calculate()"></select>
                </div>
                <div class="total-display">
                    <span id="total-hist">0 ₴</span>
                    <small id="dur-hist"></small>
                </div>
            </div>
            <div class="stream-badges" id="badges-hist"></div>
        </div>

        <!-- На вибір -->
        <div class="subject-row active" id="row-opt">
            <div class="row-top">
                <label class="col-name" style="flex-wrap: wrap;">
                    <input type="checkbox" id="check-opt" onchange="toggleRow('opt'); calculate();" checked>
                    <select id="opt-subject-name" onchange="updateOptStreams(); calculate();">
                        <option value="eng">Англійська мова</option>
                        <option value="bio">Біологія</option>
                        <option value="geo">Географія</option>
                        <option value="lit">Укр. література</option>
                    </select>
                </label>
                <div>
                    <select id="tariff-opt" onchange="calculate()">
                        <option value="standard">Стандарт</option>
                        <option value="premium">Преміум</option>
                    </select>
                </div>
                <div>
                    <select id="stream-opt" onchange="calculate()"></select>
                </div>
                <div class="total-display">
                    <span id="total-opt">0 ₴</span>
                    <small id="dur-opt"></small>
                </div>
            </div>
            <div class="stream-badges" id="badges-opt"></div>
        </div>

    </div>

    <div class="summary-card">
        <div class="summary-title">Загальна вартість навчання</div>
        <div class="grand-total"><span id="grandTotalText">0</span> ₴</div>
        <div id="installments-container" class="installments-box"></div>
    </div>
</div>

<script>
    const pricing = {
        standard: [990, 940, 890, 840],
        premium: [1980, 1880, 1780, 1680]
    };

    const streamsDB = {
        ukr:  ['2026-09-01', '2026-09-13', '2026-10-13', '2026-11-01', '2026-11-29', '2027-01-05', '2027-01-25', '2027-02-28'],
        math: ['2026-09-01', '2026-09-18', '2026-10-02', '2026-10-23', '2026-11-19', '2026-12-23', '2027-01-20', '2027-02-19'],
        hist: ['2026-09-01', '2026-09-10', '2026-10-01', '2026-11-05', '2026-12-03', '2027-01-07', '2027-02-15'],
        lit:  ['2026-09-01', '2026-09-16', '2026-10-13', '2026-11-07', '2026-11-29', '2026-12-23', '2027-01-25', '2027-02-28'],
        bio:  ['2026-09-01', '2026-09-14', '2026-10-19', '2026-11-10', '2026-11-23', '2026-12-14', '2027-01-15', '2027-02-09'],
        geo:  ['2026-09-01', '2026-09-21', '2026-10-19', '2026-11-16', '2026-12-14', '2027-01-14', '2027-02-11'],
        eng:  ['2026-09-01', '2026-09-16', '2026-09-27', '2026-10-25', '2026-11-12', '2026-12-04', '2026-12-21', '2027-01-15', '2027-02-13']
    };

    const monthsUkr = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
    const fullMonthsRemaining = { 8: 8, 9: 7, 10: 6, 11: 5, 0: 4, 1: 3 };

    function formatStreamName(dateStr) {
        const date = new Date(dateStr);
        return `старт ${date.getDate()} ${monthsUkr[date.getMonth()]}`;
    }

    function getExactDuration(dateStr) {
        const date = new Date(dateStr);
        const m = date.getMonth();
        const y = date.getFullYear();
        const d = date.getDate();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        
        const full = fullMonthsRemaining[m] || 0;
        const fraction = (daysInMonth - d + 1) / daysInMonth;
        
        // Повністю точне число без округлень
        return full + fraction;
    }

    function getDaysBetween(dateStr) {
        const now = new Date();
        now.setHours(0,0,0,0);
        const target = new Date(dateStr);
        const diffTime = target - now;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function populateStreams(subjectKey, selectElementId) {
        const select = document.getElementById(selectElementId);
        const currentVal = select.value;
        select.innerHTML = '';
        
        streamsDB[subjectKey].forEach(dStr => {
            const opt = document.createElement('option');
            opt.value = dStr;
            opt.innerText = formatStreamName(dStr);
            select.appendChild(opt);
        });

        if (currentVal) select.value = currentVal;
    }

    function updateOptStreams() {
        const subj = document.getElementById('opt-subject-name').value;
        populateStreams(subj, 'stream-opt');
        calculate();
    }

    function toggleRow(id) {
        const isChecked = document.getElementById(`check-${id}`).checked;
        const row = document.getElementById(`row-${id}`);
        
        document.getElementById(`tariff-${id}`).disabled = !isChecked;
        document.getElementById(`stream-${id}`).disabled = !isChecked;
        if (id === 'opt') document.getElementById('opt-subject-name').disabled = !isChecked;
        
        if (isChecked) row.classList.add('active');
        else {
            row.classList.remove('active');
            document.getElementById(`total-${id}`).innerText = '0 ₴';
            document.getElementById(`dur-${id}`).innerText = '';
            document.getElementById(`badges-${id}`).innerHTML = '';
        }
    }

    function calculate() {
        const allIds = ['ukr', 'math', 'hist', 'opt'];
        let selectedSubjects = [];

        allIds.forEach(id => {
            if (document.getElementById(`check-${id}`).checked) {
                const tariff = document.getElementById(`tariff-${id}`).value;
                const streamDate = document.getElementById(`stream-${id}`).value;
                const duration = getExactDuration(streamDate);
                selectedSubjects.push({ id, tariff, duration, streamDate });
            }
        });

        selectedSubjects.sort((a, b) => {
            if (a.tariff === 'premium' && b.tariff !== 'premium') return -1;
            if (a.tariff !== 'premium' && b.tariff === 'premium') return 1;
            return b.duration - a.duration;
        });

        let globalGrandTotal = 0;
        const subjectOrderInfo = {};

        selectedSubjects.forEach((subject, index) => {
            const monthlyPrice = pricing[subject.tariff][index];
            const exactTotal = monthlyPrice * subject.duration;
            const subjectTotal = Math.floor(exactTotal / 10) * 10;
            
            // Виводимо точне значення до 3 знаків без внутрішнього округлення
            const durFormatted = subject.duration.toFixed(3);
            document.getElementById(`dur-${subject.id}`).innerText = `Тривалість: ${durFormatted} міс.`;
            document.getElementById(`total-${subject.id}`).innerText = subjectTotal.toLocaleString('uk-UA') + ' ₴';
            
            globalGrandTotal += subjectTotal;
            subjectOrderInfo[subject.id] = index + 1;
        });

        document.getElementById('grandTotalText').innerText = globalGrandTotal.toLocaleString('uk-UA');
        
        allIds.forEach(id => {
            const badgeContainer = document.getElementById(`badges-${id}`);
            if (!document.getElementById(`check-${id}`).checked) {
                document.getElementById(`total-${id}`).innerText = '0 ₴';
                document.getElementById(`dur-${id}`).innerText = '';
                badgeContainer.innerHTML = '';
                return;
            }

            const streamDate = document.getElementById(`stream-${id}`).value;
            const days = getDaysBetween(streamDate);
            const orderNum = subjectOrderInfo[id];

            let html = `<span class="badge badge-green">🟢 Поточний набір · ${formatStreamName(streamDate)} · через ${days} дн.</span>`;
            if (orderNum) {
                html += `<span class="badge badge-blue">📌 ${orderNum}-й предмет у розрахунку знижки</span>`;
            }
            badgeContainer.innerHTML = html;
        });

        const installmentsContainer = document.getElementById('installments-container');
        if (selectedSubjects.length >= 3) {
            const monthlyPayment = Math.round(globalGrandTotal / 5);
            installmentsContainer.innerHTML = `При оплаті частинами на 5 платежів: <strong>${monthlyPayment.toLocaleString('uk-UA')} ₴ / міс</strong>`;
        } else {
            installmentsContainer.innerHTML = `Розтермінування доступне від 3 предметів`;
        }
    }
    
    window.onload = () => {
        const allIds = ['ukr', 'math', 'hist', 'opt'];
        allIds.forEach(id => {
            if (id === 'opt') updateOptStreams();
            else populateStreams(id, `stream-${id}`);
            toggleRow(id);
        });
        calculate();
    };
</script>

</body>
</html>
